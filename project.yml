name: KryptexMiner
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CLANG_CXX_LANGUAGE_STANDARD: c++14
    SWIFT_OBJC_BRIDGING_HEADER: Sources/App/KryptexMiner-Bridging-Header.h
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/Sources/RandomX
      - $(SRCROOT)/ThirdParty/RandomX/src
targets:
  KryptexMiner:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/RandomX/rx_bridge.cpp
      - path: ThirdParty/RandomX/src/aes_hash.cpp
      - path: ThirdParty/RandomX/src/argon2_ref.c
      - path: ThirdParty/RandomX/src/argon2_ssse3.c
      - path: ThirdParty/RandomX/src/argon2_avx2.c
      - path: ThirdParty/RandomX/src/bytecode_machine.cpp
      - path: ThirdParty/RandomX/src/cpu.cpp
      - path: ThirdParty/RandomX/src/dataset.cpp
      - path: ThirdParty/RandomX/src/soft_aes.cpp
      - path: ThirdParty/RandomX/src/virtual_memory.c
      - path: ThirdParty/RandomX/src/vm_interpreted.cpp
      - path: ThirdParty/RandomX/src/allocator.cpp
      - path: ThirdParty/RandomX/src/assembly_generator_x86.cpp
      - path: ThirdParty/RandomX/src/instruction.cpp
      - path: ThirdParty/RandomX/src/randomx.cpp
      - path: ThirdParty/RandomX/src/superscalar.cpp
      - path: ThirdParty/RandomX/src/vm_compiled.cpp
      - path: ThirdParty/RandomX/src/vm_interpreted_light.cpp
      - path: ThirdParty/RandomX/src/argon2_core.c
      - path: ThirdParty/RandomX/src/blake2_generator.cpp
      - path: ThirdParty/RandomX/src/instructions_portable.cpp
      - path: ThirdParty/RandomX/src/reciprocal.c
      - path: ThirdParty/RandomX/src/virtual_machine.cpp
      - path: ThirdParty/RandomX/src/vm_compiled_light.cpp
      - path: ThirdParty/RandomX/src/blake2/blake2b.c
      - path: ThirdParty/RandomX/src/jit_compiler_a64.cpp
      - path: ThirdParty/RandomX/src/jit_compiler_a64_static.S
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Kryptex Miner
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mxguru1.kryptexminer
        PRODUCT_NAME: KryptexMiner
        TARGETED_DEVICE_FAMILY: "1"
